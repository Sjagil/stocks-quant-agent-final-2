name: v2.24 Dynamic Deployment + PIT Training

on:
  pull_request:
  workflow_dispatch:

jobs:
  test-v2-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Focused v2.24 tests
        run: |
          python -m pytest -q \
            tests/test_dynamic_validated_deployment_v2_24.py \
            tests/test_pit_training_v2_24.py \
            tests/test_generated_forward_adapters_v2_23.py \
            tests/test_final_decision_fabric_v2_8.py
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Dependency check
        run: python -m pip check
