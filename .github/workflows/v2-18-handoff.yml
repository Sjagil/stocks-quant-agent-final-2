name: v2.18 handoff gate

on:
  pull_request:
    paths:
      - "config/cross_engine_handoff_v2_18.yaml"
      - "scripts/*v2_18.py"
      - "src/stocks/research/cross_engine_handoff_v2_18.py"
      - "tests/*v2_18.py"
      - ".github/workflows/v2-18-handoff.yml"
  push:
    branches:
      - "feature/cross-engine-v2-18"

permissions:
  contents: read

concurrency:
  group: v2-18-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas PyYAML pytest
          python -m pip install --no-deps -e .
      - name: Compile v2.18 code
        run: |
          python -m py_compile \
            src/stocks/research/cross_engine_handoff_v2_18.py \
            scripts/build_cross_engine_handoff_v2_18.py \
            scripts/audit_cross_engine_handoff_v2_18.py \
            scripts/run_cross_engine_finalization_v2_18.py
      - name: Run v2.18 fail-closed tests
        run: python -m pytest -q tests/test_cross_engine_handoff_v2_18.py
