name: v2.19 research automation gate

on:
  pull_request:
    paths:
      - "config/validated_strategy_deployment_v2_19.yaml"
      - "scripts/*v2_19.py"
      - "src/stocks/orchestration/*v2_19.py"
      - "src/stocks/orchestration/forward_signal_engine.py"
      - "src/stocks/orchestration/strategy_forward_signals.py"
      - "tests/*v2_19.py"
      - ".github/workflows/v2-19-research-automation.yml"
  push:
    branches:
      - "feature/research-automation-v2-19"
  schedule:
    - cron: "17 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-19-research-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-automation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            duckdb \
            numpy \
            pandas \
            pyarrow \
            pytest \
            PyYAML \
            scikit-learn
          python -m pip install --no-deps -e .
      - name: Compile v2.19 automation
        run: |
          python -m py_compile \
            src/stocks/orchestration/validated_strategy_deployment_v2_19.py \
            src/stocks/orchestration/forward_signal_engine_v2_19.py \
            scripts/build_validated_strategy_deployment_v2_19.py \
            scripts/audit_validated_strategy_deployment_v2_19.py \
            scripts/run_validated_forward_signals_v2_19.py \
            scripts/run_validated_strategy_automation_v2_19.py \
            scripts/run_research_automation_finalization_v2_19.py
      - name: Run fail-closed v2.18 and v2.19 contracts
        run: |
          python -m pytest -q \
            tests/test_cross_engine_handoff_v2_18.py \
            tests/test_validated_strategy_automation_v2_19.py
