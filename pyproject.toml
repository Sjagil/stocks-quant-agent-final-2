[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocks-quant-agent-final"
version = "0.4.2"
description = "Stocks/ETF/commodities market intelligence + constrained allocation + shadow RL integration"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.4.6,<3",
  "pandas>=2.2",
  "pandas-ta-classic>=0.6,<1",
  "numba>=0.66,<1",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
  "duckdb>=1.5,<2",
]

[project.optional-dependencies]
portfolio = ["cvxpy>=1.5"]
nlp = ["transformers>=4.40", "torch>=2.2"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3", "tensorboard>=2.16"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = [
  "cvxpy>=1.5",
  "transformers>=4.40",
  "torch>=2.2",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "tensorboard>=2.16",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
