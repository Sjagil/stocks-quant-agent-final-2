[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocks-quant-agent-final"
version = "0.4.4"
description = "Stocks/ETF/commodities market intelligence + constrained allocation + shadow RL integration"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.4.6,<3",
  "pandas>=2.2",
  "pandas-market-calendars>=5,<6",
  "pandas-ta-classic>=0.6,<1",
  "feedparser>=6,<7",
  "beautifulsoup4>=4,<5",
  "lxml>=5,<7",
  "safetensors>=0.4,<1",
  "accelerate>=1,<2",
  "sentencepiece>=0.2,<1",
  "tenacity>=8,<10",
  "numba>=0.66,<1",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
  "duckdb>=1.5,<2",
  "yfinance>=1,<2",
]

[project.optional-dependencies]
portfolio = ["cvxpy>=1.5"]
nlp = ["transformers>=4.40", "torch>=2.2"]
rl = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "tensorboard>=2.16",
  "torch>=2.2",
]
research = [
  "optuna>=4,<5",
  "skfolio>=0.12,<1",
  "vectorbt>=0.28,<1",
]
dev = [
  "gymnasium>=0.29",
  "optuna>=4,<5",
  "pytest>=8.0",
  "ruff>=0.6",
  "skfolio>=0.12,<1",
  "vectorbt>=0.28,<1",
]
all = [
  "cvxpy>=1.5",
  "transformers>=4.40",
  "torch>=2.2",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "tensorboard>=2.16",
  "optuna>=4,<5",
  "skfolio>=0.12,<1",
  "vectorbt>=0.28,<1",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
