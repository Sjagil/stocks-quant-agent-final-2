schema: kronos_research_v2_15
execution_authority: NONE
broker_order_submission: false
automatic_live_promotion: false
integration:
  model: NeoQuasar/Kronos-mini
  tokenizer: NeoQuasar/Kronos-Tokenizer-2k
  max_context: 512
  lookback: 256
  pred_len: 4
  stride: 8
  batch_size: 8
  temperature: 1.0
  top_k: 0
  top_p: 0.9
  sample_count: 1
  device: auto
  seed: 17
backtest:
  timeframe: 1h
  base_cost_bps_per_side: 5.0
  stress_cost_bps_per_side: 10.0
  folds: 2
  purge_bars: 64
  minimum_train_trades: 12
  minimum_valid_trades: 6
  minimum_test_trades: 6
  top_per_family: 2
  exit_contract: NEXT_OPEN_TO_HORIZON_CLOSE
  intrabar_stop_take_profit: false
promotion:
  minimum_selected_folds: 2
  minimum_positive_test_fold_ratio: 0.75
  minimum_stress_positive_test_fold_ratio: 0.75
  minimum_median_test_expectancy_bps: 0.0
  minimum_worst_test_expectancy_bps: 0.0
  minimum_median_stress_expectancy_bps: 0.0
  minimum_median_profit_factor: 1.0
  cross_engine_validation_required: true
  dynamic_universe_generalization_required: true
  minimum_evaluated_test_folds: 2
