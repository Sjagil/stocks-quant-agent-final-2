schema: reference_engine_federation_v2_16
global_policy:
  external_execution_authority: NONE
  automatic_live_promotion: false
  broker_order_submission_from_reference_engines: false
  whole_shares_only: true
  fractional_shares_allowed: false
  fixed_euro_order_cap: false
  canonical_broker_writer: stocks.live.service.live_submit_authorized
  canonical_data_plane: stocks.data.canonical
  canonical_strategy_registry: stocks.research.research_candidate_registry
  canonical_execution_contract: stocks.contracts.trade_intent.TradeIntent
optimization_policy:
  optuna_allowed_segments:
  - train
  - valid
  optuna_forbidden_segments:
  - test
  - holdout
  - live
  dynamic_generalization_frozen_hypotheses: true
  cross_engine_reselection_allowed: false
pipeline:
- stage: canonical_data
  engines:
  - Stocks
- stage: feature_and_forecast
  engines:
  - Kronos
  - qlib
  - vnpy
- stage: idea_generation
  engines:
  - Stocks
  - MoonDev-Trading-Ai-Agents
- stage: fast_screen
  engines:
  - vectorbt
- stage: train_validation_optimization
  engines:
  - optuna
- stage: leakage_safe_backtest
  engines:
  - Stocks
  - pybroker
- stage: deterministic_event_crosscheck
  engines:
  - Lean
  - nautilus_trader
- stage: agent_votes
  engines:
  - stable-baselines3-contrib
  - FinRL-Trading
  - qlib
- stage: portfolio_and_risk
  engines:
  - skfolio
  - FinRL-Trading
  - Stocks
- stage: broker_shadow_reconciliation
  engines:
  - Stocks
  - vnpy_ib
  - nautilus_trader
- stage: canonical_execution
  internal_component: stocks.live.service.live_submit_authorized
engines:
  FinRL-Trading:
    local_repo: references/FinRL-Trading
    upstream: https://github.com/AI4Finance-Foundation/FinRL-Trading.git
    runtime_integration: finrl
    roles:
    - drl_allocator
    - weight_proposal
    - rotation_challenger
    allowed_modes:
    - research
    - shadow
    forbidden:
    - direct_broker_write
    - execution_authority
  Kronos:
    local_repo: references/Kronos
    upstream: https://github.com/shiyu-coder/Kronos.git
    runtime_integration: kronos
    roles:
    - kline_foundation_forecast
    - forecast_feature
    - strategy_challenger
    allowed_modes:
    - research
    - shadow
    forbidden:
    - standalone_entry_authority
    - direct_broker_write
    - execution_authority
  Lean:
    local_repo: references/Lean
    upstream: https://github.com/QuantConnect/Lean.git
    runtime_integration: lean_reference
    roles:
    - event_backtest_crosscheck
    - portfolio_framework_reference
    - execution_model_reference
    allowed_modes:
    - research
    - shadow
    forbidden:
    - direct_broker_write
    - execution_authority
  MoonDev-Trading-Ai-Agents:
    local_repo: references/MoonDev-Trading-Ai-Agents
    upstream: https://github.com/CurvedLightGroup/MoonDev-Trading-Ai-Agents.git
    runtime_integration: moondev
    roles:
    - research_ideation
    - agent_pattern_reference
    - rbi_pattern_reference
    allowed_modes:
    - research
    forbidden:
    - numerical_truth_source
    - direct_broker_write
    - risk_authority
    - execution_authority
  nautilus_trader:
    local_repo: references/nautilus_trader
    upstream: https://github.com/nautechsystems/nautilus_trader.git
    runtime_integration: nautilus
    roles:
    - candle_validation
    - event_simulation
    - fill_crosscheck
    - ibkr_shadow_reference
    allowed_modes:
    - research
    - shadow
    forbidden:
    - canonical_broker_writer
    - autonomous_authority
    - direct_broker_write
    - execution_authority
  optuna:
    local_repo: references/optuna
    upstream: https://github.com/optuna/optuna.git
    runtime_integration: optuna_reference
    roles:
    - hyperparameter_search
    - multiobjective_search
    - pruning
    allowed_modes:
    - train
    - valid
    forbidden:
    - test_objective_access
    - holdout_objective_access
    - live_objective_access
    - execution_authority
    - direct_broker_write
  pybroker:
    local_repo: references/pybroker
    upstream: https://github.com/edtechre/pybroker.git
    runtime_integration: pybroker_reference
    roles:
    - walkforward_crosscheck
    - bootstrap_metrics
    - rule_ml_backtest_crosscheck
    allowed_modes:
    - research
    - shadow
    forbidden:
    - direct_broker_write
    - execution_authority
  qlib:
    local_repo: references/qlib
    upstream: https://github.com/microsoft/qlib.git
    runtime_integration: qlib
    roles:
    - factor_pipeline
    - ml_challenger
    - nested_decision_reference
    - rl_reference
    allowed_modes:
    - research
    - shadow
    forbidden:
    - direct_broker_write
    - execution_authority
  skfolio:
    local_repo: references/skfolio
    upstream: https://github.com/skfolio/skfolio.git
    runtime_integration: skfolio_reference
    roles:
    - portfolio_optimization
    - risk_budgeting
    - hrp_nco
    - covariance_risk_challenger
    allowed_modes:
    - research
    - shadow
    forbidden:
    - signal_manufacture
    - direct_broker_write
    - execution_authority
  stable-baselines3-contrib:
    local_repo: references/stable-baselines3-contrib
    upstream: https://github.com/Stable-Baselines-Team/stable-baselines3-contrib.git
    runtime_integration: sb3_contrib_reference
    roles:
    - maskable_ppo
    - recurrent_ppo
    - qr_dqn
    - tqc
    - trpo
    - crossq
    allowed_modes:
    - research
    - shadow
    forbidden:
    - fresh_entry_manufacture
    - hard_gate_bypass
    - direct_broker_write
    - execution_authority
  Stocks:
    local_repo: references/Stocks
    upstream: https://github.com/Sjagil/Stocks.git
    runtime_integration: stocks_reference
    roles:
    - donor_research
    - read_only_broker_snapshot
    - reconciliation_reference
    - execution_planner_reference
    allowed_modes:
    - research
    - shadow
    - read_only_broker
    forbidden:
    - federation_direct_order_submission
    - direct_broker_write
    - execution_authority
  vectorbt:
    local_repo: references/vectorbt
    upstream: https://github.com/polakowo/vectorbt.git
    runtime_integration: vectorbt_reference
    roles:
    - fast_screen
    - parameter_sweep
    - accounting_sanity_check
    allowed_modes:
    - research
    forbidden:
    - finalist_promotion_by_itself
    - direct_broker_write
    - execution_authority
  vnpy:
    local_repo: references/vnpy
    upstream: https://github.com/vnpy/vnpy.git
    runtime_integration: vnpy
    roles:
    - alpha158_feature_challenger
    - ml_lab_reference
    - strategy_lab_reference
    allowed_modes:
    - research
    - shadow
    forbidden:
    - canonical_broker_writer
    - execution_authority
    - direct_broker_write
  vnpy_ib:
    local_repo: references/vnpy_ib
    upstream: https://github.com/vnpy/vnpy_ib.git
    runtime_integration: vnpy_ib_reference
    roles:
    - ibkr_contract_reference
    - ibkr_gateway_shadow
    - broker_state_crosscheck
    allowed_modes:
    - shadow
    - read_only_broker
    forbidden:
    - send_order
    - cancel_order
    - canonical_broker_writer
    - execution_authority
    - direct_broker_write
